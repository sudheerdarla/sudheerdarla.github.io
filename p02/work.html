<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case studies — Sudheer Darla</title>
  <meta name="description" content="Case studies by Sudheer Darla: PSTAKE Finance, COMDEX and CAPTL.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" id="theme-color">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sudheer Darla — Product Designer">
  <meta property="og:description" content="Product Designer. 7+ years. 0–1 Fintech/SaaS. Complex and high-stakes flows.">
  <meta property="og:image" content="https://sudheerdarla.github.io/img/pstake-thumb.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400&display=swap"></noscript>
  <script>
    /* Set the theme before first paint so there is no flash. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* ---------- Actuity tokens (from DESIGN_actuity.md) ---------- */
    :root {
      --font-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

      --bg: #ffffff;        --bg-1: #fafafa;      --bg-3: #f2f2f3;
      --surface: #ffffff;   --surface-2: #fafafa; --elevated: #ffffff;
      --line: #ebebed;      --line-1: #e1e1e4;    --line-strong: #c9c9ce;
      --fg: #0b0b0c;        --fg-1: #1f1f22;      --fg-2: #45454a;
      --muted: #6e6e75;     --muted-2: #9a9aa0;   --muted-3: #c6c6c9;
      --accent: #0b0b0c;    --accent-2: #2c2c30;  --accent-ink: #ffffff;
      --accent-soft: #0b0b0c0f;
      --danger: #b42318;
      --dot: #e1e1e4;

      --r-md: 2px;
      --shadow-md: 0 12px 28px -12px #0a0a0c29;
      --ease-out: cubic-bezier(.2, .7, .2, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);

      --s-xs: 4px; --s-sm: 8px; --s-md: 12px; --s-lg: 16px; --s-xl: 20px;
      --s-2xl: 24px; --s-3xl: 32px; --s-4xl: 56px; --s-5xl: 92px;
    }
    [data-theme="dark"] {
      --bg: #0b0b0c;        --bg-1: #101012;      --bg-3: #1f1f22;
      --surface: #101012;   --surface-2: #1f1f22; --elevated: #1f1f22;
      --line: #232327;      --line-1: #2c2c30;    --line-strong: #45454a;
      --fg: #fafafa;        --fg-1: #f2f2f3;      --fg-2: #c9c9ce;
      --muted: #9a9aa0;     --muted-2: #6e6e75;   --muted-3: #45454a;
      --accent: #ffffff;    --accent-2: #ebebed;  --accent-ink: #0b0b0c;
      --accent-soft: #ffffff0f;
      --danger: #f97066;
      --dot: #232327;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; scroll-behavior: smooth; scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
    html[data-theme="dark"] { color-scheme: dark; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    h1, h2, h3, .tagline { text-wrap: balance; }
    .bio p, .desc, .meta { text-wrap: pretty; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle, var(--dot) 0.75px, transparent 0.75px);
      background-size: 24px 24px;
      background-position: 12px 12px;
      background-attachment: fixed;
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 16px; line-height: 24px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background-color .2s var(--ease-out), color .2s var(--ease-out);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    ul, ol { list-style: none; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: var(--r-md); }

    .skip { position: absolute; left: 16px; top: -64px; z-index: 100; background: var(--accent); color: var(--accent-ink);
      padding: 10px 16px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; }
    .skip:focus { top: 16px; }

    /* Top bar + theme toggle */
        .toggle { display: inline-flex; align-items: center; gap: var(--s-sm); min-height: 32px; padding: 0 2px; }
    .toggle-label { font-size: 13px; line-height: 16px; color: var(--muted); }
    .track { position: relative; width: 30px; height: 16px; border-radius: var(--r-md); background: var(--bg-3);
      border: 1px solid var(--line-strong); transition: background-color .2s var(--ease-out), border-color .2s var(--ease-out); }
    .knob { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: var(--r-md); background: var(--fg);
      transition: transform .2s var(--ease-out), background-color .2s var(--ease-out); }
    .toggle[aria-pressed="true"] .track { background: var(--accent); border-color: var(--accent); }
    .toggle[aria-pressed="true"] .knob { transform: translateX(14px); background: var(--accent-ink); }
    .toggle:hover .toggle-label { color: var(--fg); }

    
    .content { margin-left: calc(var(--rail-x) + var(--rail-w) + var(--rail-gap)); max-width: 880px; padding: var(--s-2xl) var(--s-2xl) var(--s-4xl) 0; }
    .box { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); overflow: hidden; container-type: inline-size; outline: none; }

    @media (max-width: 960px) {
      .content { margin: 0; max-width: none; padding: 92px var(--s-md) var(--s-3xl); }
    }
    /* Phones: the case study fills the screen edge to edge instead of floating in a framed card */
    @media (max-width: 640px) {
      .content { padding: 69px 0 0; }
      .box { border: 0; border-radius: 0; }
      .rail .toggle-label { display: none; }
    }

    /* ---------- Case study system ---------- */
    .cs { --pad: clamp(20px, 5.5cqw, 48px); counter-reset: none; }
    .cs h1, .cs h2, .cs h3, .cs h4 { color: var(--fg); }
    .cs-label, .cs-kicker, .cs-num, .cs-facts dt { font-family: var(--font-sans); font-size: 13px; line-height: 18px; letter-spacing: 0; color: var(--muted); font-weight: 500; }
    .cs-text { margin-top: var(--s-md); max-width: 40em; font-size: 16px; line-height: 26px; color: var(--fg-2); }

    .cs-hero { padding: clamp(32px, 7cqw, 56px) var(--pad) var(--s-3xl); }
    .cs-kicker { color: var(--fg); }
    .cs-tag { font-style: normal; font-weight: 400; color: var(--muted); }
    .cs-figure video { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 0; background: var(--bg-3); }
    .side .side-link b .tag { text-transform: none; font-weight: 400; color: var(--muted); letter-spacing: 0; }
    .cs-kicker span { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line-strong); color: var(--muted); font-weight: 400; }
    .cs-hero h1 { margin-top: var(--s-lg); max-width: 18em; font-size: clamp(28px, 5cqw, 40px); line-height: 1.12; font-weight: 800; letter-spacing: -0.025em; outline: none; }
    .cs-intro { margin-top: var(--s-lg); max-width: 38em; font-size: 17px; line-height: 28px; color: var(--fg-2); }
    .cs-facts { margin-top: var(--s-3xl); display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
    .cs-facts div { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); }
    .cs-facts dd { margin-top: 4px; font-size: 14px; line-height: 21px; font-weight: 500; color: var(--fg); }
    .cs-hero-figure { margin: 0 var(--pad); }
    .cs-figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 0; background: var(--bg-3); }
    .cs-figure img.is-framed, .cs-hero-figure img.is-framed, .lb img.is-framed { border: 1px solid rgba(128, 128, 136, .28); }
    .cs-figure img.is-bare { border: 0; }
    .cs-figure figcaption { margin-top: var(--s-sm); font-size: 13px; line-height: 19.5px; color: var(--muted); }

    .cs-stats { margin: var(--s-3xl) var(--pad) 0; display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--line); }
    .cs-stats li { padding: var(--s-xl) 0; border-bottom: 1px solid var(--line); }
    .cs-stats strong { display: block; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; color: var(--fg); font-variant-numeric: tabular-nums; }
    .cs-stats span { display: block; margin-top: 6px; max-width: 22em; font-size: 13px; line-height: 19.5px; color: var(--muted); }

    .cs-sec { margin-top: var(--s-4xl); padding: var(--s-4xl) var(--pad) 0; border-top: 1px solid var(--line); }
    .cs-sec > * + * { margin-top: var(--s-3xl); }
        .cs-sec-head h2 { margin-top: var(--s-md); max-width: 22em; font-size: clamp(22px, 3.6cqw, 28px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }

    /* Lists */
    .cs-lists { display: grid; gap: var(--s-2xl); }
    .cs-list ul { margin-top: var(--s-md); border-top: 1px solid var(--line); }
    .cs-list li { display: flex; justify-content: space-between; align-items: center; gap: var(--s-lg); padding: var(--s-md) 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px; color: var(--fg-1); }
    .cs-list li svg { flex: none; color: var(--fg); }
    .cs-list.is-muted li { color: var(--muted); }
    .cs-list.is-muted li svg { color: var(--muted-2); }

    /* Quote */
    .cs-quote { padding-left: var(--s-xl); border-left: 2px solid var(--fg); }
    .cs-quote p { max-width: 30em; font-size: 20px; line-height: 30px; font-weight: 500; letter-spacing: -0.01em; color: var(--fg); }
    .cs-quote footer { margin-top: var(--s-md); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); }

    /* Cards */
    .cs-cards { display: grid; gap: var(--s-md); }
    .cs-card { display: flex; flex-direction: column; padding: var(--s-xl); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg-1); }
    .cs-card .cs-label { margin-bottom: var(--s-sm); }
    .cs-card h3 { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.005em; }
    .cs-card h3 + p { margin-top: var(--s-xs); }
    .cs-card p:not(.cs-label) { font-size: 14px; line-height: 22px; color: var(--fg-2); }
    .cs-dots { margin-top: var(--s-sm); }
    .cs-dots li { position: relative; padding-left: 14px; font-size: 14px; line-height: 22px; color: var(--fg-2); }
    .cs-dots li::before { content: ""; position: absolute; left: 0; top: 10px; width: 4px; height: 4px; background: var(--muted-2); }
    .cs-card-foot { margin-top: auto; padding-top: var(--s-lg); }
    .cs-card h3 + .cs-card-foot { margin-top: var(--s-lg); border-top: 1px solid var(--line); }
    .cs-card-foot .cs-label { margin: 0 0 var(--s-xs); color: var(--fg-1); }

    /* Table */
    .cs-table { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 22px; }
    .cs-table th, .cs-table td { text-align: left; vertical-align: top; padding: 14px var(--s-lg) 14px 0; border-bottom: 1px solid var(--line); }
    .cs-table thead th { padding-top: 0; font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 500; border-bottom-color: var(--line-1); }
    .cs-table tbody th { width: 40%; font-weight: 500; color: var(--fg); }
    .cs-table td { color: var(--fg-2); padding-right: 0; }

    /* Columns (mental model) */
    .cs-columns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-md); }
    .cs-col-head { padding: var(--s-md) 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg-1); }
    .cs-col-head h3 { font-size: 16px; line-height: 24px; font-weight: 700; }
    .cs-col-head p { font-size: 13px; line-height: 19.5px; color: var(--muted); }
    .cs-col.is-strong .cs-col-head { border-color: var(--fg); background: var(--bg); }
    .cs-col ul { margin-top: var(--s-sm); display: grid; gap: 6px; }
    .cs-col li { padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r-md); font-size: 13.5px; line-height: 20px; color: var(--fg-2); }

    /* Flow */
    .cs-flow { border-top: 1px solid var(--line); }
    .cs-flow-row { display: grid; gap: var(--s-sm); padding: 14px 0; border-bottom: 1px solid var(--line); }
    .cs-flow-row h3 { display: flex; align-items: center; gap: var(--s-sm); font-size: 15px; line-height: 22px; font-weight: 600; }
    .cs-flow-row.is-key h3::before, .cs-legend span { content: ""; width: 8px; height: 8px; flex: none; background: var(--fg); }
    .cs-flow-row ol { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .cs-flow-row li { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; line-height: 20px; color: var(--fg-2); }
    .cs-flow-row li { padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg-1); }
    .cs-flow-row li + li { position: relative; margin-left: 14px; }
    .cs-flow-row li + li::before { content: ""; position: absolute; left: -13px; top: 50%; width: 8px; height: 1px; background: var(--muted-2); }
    .cs-flow-row.is-key li { border-color: var(--line-strong); color: var(--fg); }
    .cs-legend { display: flex; align-items: center; gap: var(--s-sm); margin-top: var(--s-md) !important; font-size: 13px; line-height: 19.5px; color: var(--muted); }
    .cs-legend span { display: inline-block; }

    /* Steps */
    .cs-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s-2xl); counter-reset: step; border-top: 1px solid var(--line); }
    .cs-steps li { counter-increment: step; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .cs-steps h3 { margin-top: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
    .cs-steps p { font-size: 13.5px; line-height: 20px; color: var(--muted); }

    /* Decisions */
    .cs-decision + .cs-decision { padding-top: var(--s-4xl); border-top: 1px solid var(--line); }
    .cs-sec > .cs-decision + .cs-decision { margin-top: var(--s-4xl); }
    .cs-decision h3 { margin-top: 0; max-width: 24em; font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.015em; }
    .cs-shots { margin-top: var(--s-2xl); display: grid; gap: var(--s-md); }
    .cs-decision .cs-video { margin-top: var(--s-2xl); }
    .cs-points { margin-top: var(--s-2xl); display: grid; gap: var(--s-xl) var(--s-2xl); counter-reset: pt; }
    .cs-points li { counter-increment: pt; display: grid; grid-template-columns: 24px 1fr; column-gap: var(--s-md); }
    .cs-points li::before { content: counter(pt); grid-row: span 2; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--r-md); font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
    .cs-points h4 { font-size: 15px; line-height: 22px; font-weight: 600; }
    .cs-points p { margin-top: 2px; font-size: 14px; line-height: 22px; color: var(--fg-2); }

    /* Compare */
    .cs-compare { display: grid; gap: var(--s-md); }
    .cs-compare > div { padding: var(--s-xl); border: 1px solid var(--line); border-radius: var(--r-md); }
    .cs-compare > div p:not(.cs-label) { margin-top: var(--s-sm); font-size: 16px; line-height: 24px; color: var(--fg-2); }
    .cs-compare .is-after { border-color: var(--fg); }
    .cs-compare .is-after p:not(.cs-label) { color: var(--fg); font-weight: 500; }
    .cs-compare-arrow { display: none; color: var(--muted); }

    /* Chips */
    .cs-chips ul { margin-top: var(--s-md); display: flex; flex-wrap: wrap; gap: var(--s-sm); }
    .cs-chips li { padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--r-md); font-size: 14px; line-height: 20px; color: var(--fg-1); }

    /* Numbered learnings */
    .cs-numbered { display: grid; gap: 0 var(--s-2xl); counter-reset: ln; border-top: 1px solid var(--line); }
    .cs-numbered li { counter-increment: ln; padding: var(--s-xl) 0; border-bottom: 1px solid var(--line); }
        .cs-numbered h3 { margin-top: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    .cs-numbered p { margin-top: var(--s-xs); font-size: 14px; line-height: 22px; color: var(--fg-2); }

    /* End + next */
    .cs-end { margin-top: var(--s-4xl); padding: var(--s-4xl) var(--pad); border-top: 1px solid var(--line); }
    @media (max-width: 640px) { .cs-sec, .cs-end { margin-top: var(--s-3xl); padding-top: 40px; } .cs-end { padding-bottom: 40px; } }
    .cs-end h2 { font-size: clamp(22px, 3.6cqw, 28px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .cs-btns { margin-top: var(--s-2xl); display: flex; flex-wrap: wrap; gap: var(--s-sm); }
    .cs-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 var(--s-lg); border: 1px solid var(--line-strong); border-radius: var(--r-md); font-size: 14px; font-weight: 500; color: var(--fg); transition: background-color .15s var(--ease-out), border-color .15s var(--ease-out); }
    .cs-btn:hover { background: var(--bg-3); border-color: var(--fg); }
    .cs-btn.is-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .cs-btn.is-primary:hover { background: var(--accent-2); }
    .cs-next { display: flex; justify-content: space-between; align-items: center; gap: var(--s-lg); padding: var(--s-xl) var(--pad, 24px); border-top: 1px solid var(--line); background: var(--bg-1); }
    .cs-next a { display: inline-flex; align-items: center; gap: var(--s-sm); min-height: 40px; font-size: 15px; font-weight: 600; color: var(--fg); }
    .cs-next a .cs-label { font-weight: 400; }
    .cs-next a:hover b { text-decoration: underline; text-underline-offset: 4px; }
    .cs-next svg { transition: transform .2s var(--ease-out); }
    .cs-next a:hover svg { transform: translateX(3px); }
    .cs-next b { font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 14px; }

    /* Container breakpoints */
    @container (min-width: 520px) {
      .cs-cards.c2, .cs-cards.c4, .cs-cards.c3, .cs-numbered, .cs-steps { grid-template-columns: repeat(2, 1fr); }
      .cs-shots.two { grid-template-columns: 1fr 1fr; }
      .cs-points { grid-template-columns: repeat(2, 1fr); }
      .cs-flow-row { grid-template-columns: 170px 1fr; align-items: center; }
    }
    @container (min-width: 700px) {
      .cs-facts { grid-template-columns: repeat(4, 1fr); }
      .cs-facts div { padding-right: var(--s-lg); }
      .cs-stats { grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
      .cs-stats li { border-bottom: 0; padding-right: var(--s-xl); }
      .cs-stats li + li { border-left: 1px solid var(--line); padding-left: var(--s-xl); }
      .cs-lists { grid-template-columns: 1.4fr 1fr; gap: var(--s-3xl); }
      .cs-cards.c3, .cs-steps { grid-template-columns: repeat(3, 1fr); }
      .cs-cards.c4, .cs-columns { grid-template-columns: repeat(4, 1fr); }
      .cs-points { grid-template-columns: repeat(3, 1fr); }
      .cs-points.four { grid-template-columns: repeat(2, 1fr); }
      .cs-compare { grid-template-columns: 1fr auto 1fr; align-items: stretch; }
      .cs-compare-arrow { display: grid; place-items: center; }
    }


    /* Brand + design system sheet. The sheet shows the product's own dark UI in both site themes. */
    .ds { --n: #0E0D12; --s1: #141318; --s2: #1B1A20; --s3: #24222A; --ln: rgba(255,255,255,.07); --ln2: rgba(255,255,255,.12);
      --tx: #F5F5F6; --tx2: #C9C8CE; --mu: #8E8C96; --co: #E15365; --mi: #3CC47C;
      border: 1px solid var(--line); border-radius: var(--r-md); background: var(--n); color: var(--tx); overflow: hidden; font-feature-settings: "tnum"; }
    .ds-top { display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(16px, 3.5cqw, 28px); border-bottom: 1px solid var(--ln); background: var(--s1); }
    .ds-top-logo { display: flex; color: #fff; --logo-inner: #1F1D2B; }

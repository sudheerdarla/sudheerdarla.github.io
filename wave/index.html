<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatLiquid — Trade the world. From India.</title>
  <meta name="description" content="Global equities, crypto and commodities. One account. Rupees in and out. 24/7.">
  <link rel="icon" href="../bl/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0d0f12;
      --ink-2: #1c2228;
      --ink-3: #3b434b;
      --line: rgba(13, 15, 18, 0.08);
      --deep: #031c26;           /* darkest wave colour, shown below the hero */
      --card-border: rgba(255, 255, 255, 0.3);
      --font-display: "Host Grotesk", "Inter", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--deep); }
    body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ---------- Hero (wave sits behind nav + copy + product) ---------- */
    .hero { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; }
    .waves { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; display: block; }
    .wrap { max-width: 1440px; margin: 0 auto; padding-inline: max(16px, min(240px, 16.67vw)); }

    .nav { border-bottom: 1px solid var(--line); }
    .nav__inner { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .nav__brand img { width: 167px; height: auto; margin-left: -9px; }
    .nav__links { display: flex; gap: 29px; font-size: 14px; color: var(--ink-3); }
    .nav__actions { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--ink-3); }
    .nav__links a:hover, .nav__login:hover { color: var(--ink); }

    .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; font: 500 14px/1 var(--font-body); white-space: nowrap; transition: transform .15s ease, filter .15s ease; }
    .btn svg { width: 12px; height: 12px; }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:focus-visible, a:focus-visible { outline: 2px solid #1b6ca8; outline-offset: 3px; }
    .btn--dark { background: #121417; color: #fff; padding: 9px 17px 9px 18px; }
    .btn--light { background: #fff; color: var(--ink); padding: 8px 13px 8px 12px; }

    /* Spare viewport height is split above and below the copy; the card stays anchored to the bottom edge */
    .hero__copy { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; margin-block: auto; padding-block: 118px 36px; }
    .hero__title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(38px, 4.2vw, 50px); line-height: 1.04; letter-spacing: -0.04em; color: var(--ink); }
    .hero__side { display: flex; flex-direction: column; align-items: flex-end; gap: 22px; }
    .hero__side p { margin: 0; max-width: 300px; text-align: right; font-size: 15px; line-height: 22px; color: var(--ink-2); }

    .product { width: 100%; max-width: 1252px; margin: 0 auto; padding-inline: 16px; }
    .product__frame { border: 6px solid var(--card-border); border-bottom: 0; border-radius: 20px 20px 0 0; overflow: hidden; background: #fff; }
    .product__frame img { -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent); mask-image: linear-gradient(180deg, #000 82%, transparent); }
    .product__frame img { width: 100%; height: auto; }

    @media (max-width: 860px) {
      .nav__links { display: none; }
      .hero__copy { padding-block: 64px 32px; }
      .hero__side { align-items: flex-start; }
      .hero__side p { text-align: left; }
    }
    @media (max-width: 420px) { .nav__login { display: none; } }
  </style>
</head>
<body>

  <section class="hero" id="top">
    <canvas class="waves" id="waves" aria-hidden="true"></canvas>

    <header class="nav">
      <div class="wrap nav__inner">
        <a class="nav__brand" href="#top" aria-label="BharatLiquid home">
          <img src="assets/logo.svg" width="183" height="47" alt="BharatLiquid">
        </a>
        <nav class="nav__links" aria-label="Primary">
          <a href="#">Product</a>
          <a href="#">Resources</a>
          <a href="#">Company</a>
          <a href="#">Contact</a>
        </nav>
        <div class="nav__actions">
          <a class="nav__login" href="#">Login</a>
          <a class="btn btn--dark" href="#">Launch App
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </div>
      </div>
    </header>

    <div class="wrap hero__copy">
      <h1 class="hero__title">Trade the world.<br>From India.</h1>
      <div class="hero__side">
        <p>Global equities, crypto and commodities.<br>One account. Rupees in and out. 24/7.</p>
        <a class="btn btn--light" href="#">Get started
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </div>
    </div>

    <div class="product">
      <div class="product__frame">
        <img src="assets/perps.png" width="1208" height="548" alt="BharatLiquid Perps screen: featured markets, top gainers and top losers">
      </div>
    </div>
  </section>

  <script>
  /* Waves background — vanilla port of waves-background.tsx (21st.dev Shader Builder, "Waves").
     One WebGL canvas that fills the hero. Cursor is disabled in this preset. */
  (function () {
    var VERT = "attribute vec2 a_position;\nvoid main(){ gl_Position = vec4(a_position, 0.0, 1.0); }";

    var FRAG = [
      "#ifdef GL_FRAGMENT_PRECISION_HIGH", "precision highp float;", "#else", "precision mediump float;", "#endif",
      "uniform vec3 u_colors[8];",
      "uniform vec4 u_scene; uniform vec4 u_shape; uniform vec4 u_surface; uniform vec4 u_finish;",
      "uniform vec4 u_transform; uniform vec4 u_space; uniform vec4 u_cursor;",
      "#define u_resolution u_scene.xy", "#define u_time u_scene.z", "#define u_colorCount u_scene.w",
      "#define u_scale u_shape.x", "#define u_intensity u_shape.y", "#define u_paramA u_shape.z", "#define u_warp u_shape.w",
      "#define u_detail u_surface.x", "#define u_contrast u_surface.y", "#define u_brightness u_surface.z", "#define u_saturation u_surface.w",
      "#define u_hue u_finish.x", "#define u_vignette u_finish.y", "#define u_blur u_finish.z", "#define u_grain u_finish.w",
      "#ifdef GL_FRAGMENT_PRECISION_HIGH", "#define u_seed u_transform.x", "#else", "#define u_seed mod(u_transform.x, 31.0)", "#endif",
      "#define u_rotate u_transform.y", "#define u_drift u_transform.z", "#define u_oklab u_transform.w",
      "#define u_offset u_space.xy", "#define u_mouse u_space.zw",
      "#define u_cursorPresence u_cursor.x", "#define u_cursorEffect u_cursor.y", "#define u_cursorStrength u_cursor.z", "#define u_cursorRadius u_cursor.w",
      "float hash21(vec2 p){",
      "#ifndef GL_FRAGMENT_PRECISION_HIGH", "  p = mod(p, 31.0);", "#endif",
      "  p = fract(p * vec2(234.34, 435.345)); p += dot(p, p + 34.23); return fract(p.x * p.y); }",
      "float grainHash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }",
      "float noise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);",
      "  return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), u.x), mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), u.x), u.y); }",
      "float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(17.0,9.2); a*=0.5; } return v; }",
      "vec3 srgbToLinear(vec3 c){ return mix(c/12.92, pow((c+0.055)/1.055, vec3(2.4)), step(0.04045, c)); }",
      "vec3 linearToSrgb(vec3 c){ return mix(c*12.92, 1.055*pow(max(c,vec3(0.0)), vec3(1.0/2.4))-0.055, step(0.0031308, c)); }",
      "vec3 linToOklab(vec3 c){",
      "  float l=0.4122214708*c.r+0.5363325363*c.g+0.0514459929*c.b;",
      "  float m=0.2119034982*c.r+0.6806995451*c.g+0.1073969566*c.b;",
      "  float s=0.0883024619*c.r+0.2817188376*c.g+0.6299787005*c.b;",
      "  l=pow(max(l,0.0),1.0/3.0); m=pow(max(m,0.0),1.0/3.0); s=pow(max(s,0.0),1.0/3.0);",
      "  return vec3(0.2104542553*l+0.7936177850*m-0.0040720468*s, 1.9779984951*l-2.4285922050*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.8086757660*s); }",
      "vec3 oklabToLin(vec3 c){",
      "  float l=c.x+0.3963377774*c.y+0.2158037573*c.z; float m=c.x-0.1055613458*c.y-0.0638541728*c.z; float s=c.x-0.0894841775*c.y-1.2914855480*c.z;",
      "  l=l*l*l; m=m*m*m; s=s*s*s;",
      "  return vec3(4.0767416621*l-3.3077115913*m+0.2309699292*s, -1.2684380046*l+2.6097574011*m-0.3413193965*s, -0.0041960863*l-0.7034186147*m+1.7076147010*s); }",
      "vec3 mixColour(vec3 a, vec3 b, float t){",
      "  if(u_oklab>0.5){ vec3 la=linToOklab(srgbToLinear(a)); vec3 lb=linToOklab(srgbToLinear(b)); return clamp(linearToSrgb(oklabToLin(mix(la,lb,t))),0.0,1.0); }",
      "  return mix(a,b,t); }",
      "vec3 palette(float x){ float n=max(u_colorCount-1.0,1.0); float f=clamp(x,0.0,1.0)*n; vec3 col=u_colors[0];",
      "  for(int i=0;i<7;i++){ if(float(i)<n) col=mixColour(col,u_colors[i+1],smoothstep(0.0,1.0,clamp(f-float(i),0.0,1.0))); } return col; }",
      "vec3 hueRotate(vec3 col, float a){",
      "  const mat3 toYIQ=mat3(0.299,0.596,0.211, 0.587,-0.274,-0.523, 0.114,-0.322,0.312);",
      "  const mat3 toRGB=mat3(1.0,1.0,1.0, 0.956,-0.272,-1.106, 0.621,-0.647,1.703);",
      "  vec3 yiq=toYIQ*col; float ca=cos(a), sa=sin(a); yiq=vec3(yiq.x, yiq.y*ca-yiq.z*sa, yiq.y*sa+yiq.z*ca); return toRGB*yiq; }",
      "vec3 shade(vec2 uv, vec2 p, float t){",
      "  float y = uv.y + sin(uv.x*(3.0+u_intensity*9.0)+t*0.8)*0.08 + (fbm(p*2.0+t*0.1)-0.5)*u_intensity*0.6;",
      "  return palette(y); }",
      "void main(){",
      "  vec2 uv=gl_FragCoord.xy/u_resolution.xy; vec2 screenUv=uv;",
      "  vec2 p=(gl_FragCoord.xy-0.5*u_resolution.xy)/min(u_resolution.x,u_resolution.y);",
      "  float cursorMask=0.0;",
      "  if(u_cursorPresence>0.001){",
      "    vec2 cursor=(0.5*u_mouse*u_resolution.xy)/min(u_resolution.x,u_resolution.y); vec2 cursorDelta=p-cursor;",
      "    if(u_cursorEffect<0.5){ p+=cursor*u_cursorPresence*u_cursorStrength*0.55; }",
      "    else { float cursorDistance=length(cursorDelta); vec2 cursorDirection=cursorDelta/max(cursorDistance,0.0001);",
      "      cursorMask=u_cursorPresence*(1.0-smoothstep(0.0,u_cursorRadius,cursorDistance));",
      "      if(u_cursorEffect<1.5){ p-=cursorDirection*cursorMask*u_cursorStrength*0.24; }",
      "      else if(u_cursorEffect<2.5){ float ang=cursorMask*u_cursorStrength*2.2; float cc=cos(ang), cs=sin(ang); p=cursor+mat2(cc,-cs,cs,cc)*cursorDelta; }",
      "      else if(u_cursorEffect<3.5){ float ripple=sin(cursorDistance/max(u_cursorRadius,0.001)*18.0-u_time*5.0); p-=cursorDirection*ripple*cursorMask*u_cursorStrength*0.07; } } }",
      "  uv=p*min(u_resolution.x,u_resolution.y)/u_resolution.xy+0.5; p*=u_scale;",
      "  if(abs(u_rotate)>0.0001){ float cr=cos(u_rotate), sr=sin(u_rotate); p=mat2(cr,-sr,sr,cr)*p; }",
      "  p+=u_offset;",
      "  if(u_drift>0.0001) p+=u_drift*vec2(sin(u_time*0.31), cos(u_time*0.23));",
      "  if(u_warp>0.0){ p+=u_warp*(vec2(fbm(p*u_detail+u_seed), fbm(p*u_detail+vec2(5.2,1.3)))-0.5); }",
      "  vec3 col;",
      "  if(u_blur>0.0){ float e=u_blur; float pe=e*u_scale; vec2 uvE=vec2(e)*min(u_resolution.x,u_resolution.y)/u_resolution.xy;",
      "    col=shade(uv,p,u_time)*0.36;",
      "    col+=shade(uv+vec2(uvE.x,0.0),p+vec2(pe,0.0),u_time)*0.16; col+=shade(uv-vec2(uvE.x,0.0),p-vec2(pe,0.0),u_time)*0.16;",
      "    col+=shade(uv+vec2(0.0,uvE.y),p+vec2(0.0,pe),u_time)*0.16; col+=shade(uv-vec2(0.0,uvE.y),p-vec2(0.0,pe),u_time)*0.16;",
      "  } else { col=shade(uv,p,u_time); }",
      "  if(abs(u_contrast-1.0)>0.0001) col=(col-0.5)*u_contrast+0.5;",
      "  if(abs(u_saturation-1.0)>0.0001){ float luma=dot(col,vec3(0.299,0.587,0.114)); col=mix(vec3(luma),col,u_saturation); }",
      "  if(abs(u_hue)>0.0001) col=hueRotate(col,u_hue);",
      "  if(abs(u_brightness)>0.0001) col+=u_brightness;",
      "  if(u_vignette>0.0001){ float vd=length(screenUv-0.5)*1.41421356; col*=1.0-u_vignette*smoothstep(0.35,1.0,vd); }",
      "  if(u_cursorPresence>0.001 && u_cursorEffect>3.5) col+=(vec3(0.18)+col*0.12)*cursorMask*u_cursorStrength;",
      "  if(u_grain>0.0001) col+=(grainHash(gl_FragCoord.xy+vec2(u_seed*17.0,u_seed*31.0))-0.5)*u_grain;",
      "  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);",
      "}"
    ].join("\n");

    var L = [0.9176470588235294, 0.9764705882352941, 1];
    var U = {
      colors: [[0.011764705882352941,0.10980392156862745,0.14901960784313725],[0.10588235294117647,0.4235294117647059,0.6588235294117647],[0.35294117647058826,0.8235294117647058,0.9568627450980393],L,L,L,L,L],
      colorCount: 4, scale: 1.08, intensity: 0.62, paramA: 0.5, warp: 0.24, detail: 2.912,
      contrast: 1.158, brightness: 0, saturation: 1, hue: 0, vignette: 0, blur: 0, grain: 0.042,
      seed: 1, rotate: 4.0841, offsetX: 0, offsetY: 0, drift: 0,
      cursorEnabled: false, cursorEffect: 2, cursorStrength: 0.65, cursorRadius: 0.46, oklab: 0, timeScale: 0.86
    };

    var canvas = document.getElementById("waves");
    var gl = canvas.getContext("webgl", { antialias: false });
    if (!gl) { canvas.style.background = "linear-gradient(180deg,#eaf9ff 0%,#5ad2f4 45%,#1b6ca8 75%,#031c26 100%)"; return; }

    function compile(type, src) {
      var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    }
    var program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(program); gl.useProgram(program);

    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    function u(n) { return gl.getUniformLocation(program, n); }
    var uScene = u("u_scene"), uSpace = u("u_space"), uCursor = u("u_cursor");
    gl.uniform3fv(u("u_colors"), new Float32Array([].concat.apply([], U.colors)));
    gl.uniform4f(u("u_shape"), U.scale, U.intensity, U.paramA, U.warp);
    gl.uniform4f(u("u_surface"), U.detail, U.contrast, U.brightness, U.saturation);
    gl.uniform4f(u("u_finish"), U.hue, U.vignette, U.blur, U.grain);
    gl.uniform4f(u("u_transform"), U.seed, U.rotate, U.drift, U.oklab);
    gl.uniform4f(uSpace, U.offsetX, U.offsetY, 0, 0);
    gl.uniform4f(uCursor, 0, U.cursorEffect, U.cursorStrength, U.cursorRadius);

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var raf = 0, inView = true, visible = document.visibilityState === "visible";
    var start = performance.now();

    function resize() {
      var r = canvas.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var rw = Math.max(1, Math.round(r.width * dpr)), rh = Math.max(1, Math.round(r.height * dpr));
      var k = Math.min(1, Math.sqrt(2e6 / (rw * rh)));
      var w = Math.max(1, Math.round(rw * k)), h = Math.max(1, Math.round(rh * k));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    }
    function request() { if (visible && inView && !raf) raf = requestAnimationFrame(render); }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
    function render(now) {
      raf = 0;
      if (!visible || !inView) return;
      resize();
      var t = reduceMotion ? 6 : ((now - start) / 1000) * U.timeScale;
      gl.uniform4f(uScene, canvas.width, canvas.height, t, U.colorCount);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!reduceMotion) request();
    }

    new ResizeObserver(function () { resize(); request(); }).observe(canvas);
    new IntersectionObserver(function (e) { inView = e[0] ? e[0].isIntersecting : true; inView ? request() : stop(); }).observe(canvas);
    document.addEventListener("visibilitychange", function () { visible = document.visibilityState === "visible"; visible ? request() : stop(); });
    request();
  })();
  </script>
</body>
</html>

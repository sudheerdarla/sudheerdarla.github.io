<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatLiquid — 3D tokens (reference)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr; height: 100vh; background: #151213; color: #fff; font: 14px/1.5 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding: 20px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    p { margin: 0; color: rgba(255, 255, 255, 0.6); }
    a { color: #fff; }
    .hero { position: relative; overflow: hidden; }
    .coins { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
    .coins.is-ready { opacity: 1; }
    .coins canvas { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>3D tokens, reference</h1>
    <p>three.js rebuild of the token ring. The <a href="../">waitlist page</a> uses the Figma render instead.</p>
  </header>
  <main class="hero" data-hero>
    <div class="coins" data-coins aria-hidden="true"></div>
  </main>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <script type="module" src="coins3d.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatLiquid — 3D ring (reference)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Manrope:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; background: #151213; color: #fff; font: 14px/1.5 "Host Grotesk", system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding: 20px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    h1 { margin: 0; font: 600 16px/1.3 Manrope, system-ui, sans-serif; }
    p { margin: 0; color: rgba(255, 255, 255, 0.6); }
    a { color: #fff; }
    main { display: grid; place-items: center; padding: 32px 16px; }
    .ring { position: relative; width: min(760px, 92vw); aspect-ratio: 1500 / 1381; }
    .ring__img, .ring__canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ring__canvas { opacity: 0; transition: opacity .6s ease; }
    .ring.is-3d .ring__canvas { opacity: 1; }
    .ring.is-3d .ring__img { opacity: 0; transition: opacity .6s ease; }
  </style>
</head>
<body>
  <header>
    <h1>3D ring, reference</h1>
    <p>WebGL rebuild of the hero render: the flaps turn about the ring’s axis while its outline stays fixed. Not used on the <a href="../">waitlist page</a>.</p>
  </header>
  <main>
    <div class="ring" data-ring aria-hidden="true">
      <img class="ring__img" src="../assets/ribbon-ring.webp" width="1500" height="1381" alt="">
    </div>
  </main>
  <script type="module" src="ring3d.js"></script>
</body>
</html>

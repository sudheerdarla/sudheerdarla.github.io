<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatLiquid — Join the waitlist</title>
  <meta name="description" content="One INR account for global perpetual markets, 24/7, onshore and compliant.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/ribbon-ring.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="top__inner">
        <a class="brand" href="#top" aria-label="BharatLiquid home">
          <img class="brand__mark" src="assets/logo-mark.svg" width="26" height="26" alt="">
          <img class="brand__word" src="assets/logo-word.svg" width="120" height="19" alt="BharatLiquid">
        </a>
        <div class="top__right">
          <a class="top__link" href="../new01/learn.html">Docs</a>
          <button class="pill pill--black" type="button" data-join>
            Join Waitlist
            <img class="arrow" src="assets/arrow-dark.svg" width="16" height="16" alt="">
          </button>
        </div>
      </div>
    </header>

    <main class="hero" id="top" data-hero>
      <img class="hero__grad" src="assets/hero-gradient.png" alt="">

      <div class="glow glow--right" aria-hidden="true" data-glow><img src="assets/glow-right.svg" alt=""></div>
      <img class="hero__star" src="assets/star-sm.svg" width="13" height="13" alt="">

      <div class="hero__copy">
        <p class="built">
          <span>Built On</span>
          <span class="built__chip"><img src="assets/hl-icon.svg" width="13" height="9" alt="">Hyperliquid</span>
        </p>
        <h1 class="title">Global markets.<br>Settled in INR.</h1>
        <p class="lead">One INR account for global perpetual markets, 24/7, onshore and compliant.</p>
        <div class="actions">
          <button class="pill pill--white" type="button" data-join>
            Join Waitlist
            <img class="arrow" src="assets/arrow-light.svg" width="16" height="16" alt="">
          </button>
          <a class="pill pill--outline" href="../new01/learn.html">Docs</a>
        </div>
        <p class="fine">Equity-linked markets provide trading exposure, not share ownership.</p>
      </div>

      <!-- The ring stays in place and its flaps turn slowly (ring3d.js). The image is the
           fallback for browsers without WebGL and for reduced-motion settings. -->
      <div class="ring" data-ring aria-hidden="true">
        <img class="ring__img" src="assets/ribbon-ring.webp" width="1500" height="1381" alt="">
      </div>
    </main>

    <div class="rule" aria-hidden="true">
      <svg class="rule__star rule__star--l" viewBox="0 0 13 13" width="13" height="13"><path d="M6.5 0C7.05 3.34 9.66 5.95 13 6.5 9.66 7.05 7.05 9.66 6.5 13 5.95 9.66 3.34 7.05 0 6.5 3.34 5.95 5.95 3.34 6.5 0Z" fill="#EBEBEB"/></svg>
      <svg class="rule__star rule__star--r" viewBox="0 0 13 13" width="13" height="13"><path d="M6.5 0C7.05 3.34 9.66 5.95 13 6.5 9.66 7.05 7.05 9.66 6.5 13 5.95 9.66 3.34 7.05 0 6.5 3.34 5.95 5.95 3.34 6.5 0Z" fill="#EBEBEB"/></svg>
    </div>
  </div>

  <dialog class="join" id="join" aria-labelledby="join-title">
    <form class="join__form" data-signup novalidate>
      <button class="join__x" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h2 id="join-title">Join the waitlist</h2>
      <p class="join__sub">We’ll email you when access opens.</p>
      <label class="sr-only" for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
      <button class="pill pill--white join__submit" type="submit">Join Waitlist</button>
      <p class="join__msg" data-msg aria-live="polite"></p>
    </form>
  </dialog>

  <script src="script.js"></script>
  <script type="module" src="ring3d.js"></script>
</body>
</html>

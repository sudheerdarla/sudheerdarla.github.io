<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saifuro Console — concept</title>
<meta name="description" content="Concept prototype of an agent-payments control console, by Sudheer Darla.">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon-32.png">
<style>
:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --line:#E4E7EC; --ink:#0F1E33; --ink2:#5B6577; --ink3:#8A93A3;
  --accent:#1D4ED8; --accent-soft:#E8EEFD;
  --ok:#15803D; --ok-soft:#E7F5EC; --warn:#B45309; --warn-soft:#FDF3E3; --warn-line:#F3D9AE; --bad:#B42318; --bad-soft:#FDECEA;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.note{background:var(--ink);color:#C9D2E0;font-size:12px;text-align:center;padding:6px 16px}
.note a{color:#fff}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 30px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:16px;padding:0 10px 18px;display:flex;align-items:center;gap:8px}
.brand i{width:20px;height:20px;border-radius:6px;background:var(--ink);display:inline-block}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:11px;background:var(--warn);color:#fff;border-radius:999px;padding:0 7px;font-weight:700;line-height:18px}
.side .foot{margin-top:auto;padding:12px 10px;font-size:12px;color:var(--ink3);display:grid;gap:8px}
.side .foot .demo{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-size:12px}

main{padding:28px 32px 60px;max-width:1080px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0}
.sub{color:var(--ink2);margin:4px 0 0}
.back{font-size:13px;text-decoration:none;color:var(--ink2);display:inline-block;margin-bottom:6px}
.back:hover{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stat .k{color:var(--ink2);font-size:12px}
.stat .v{font-size:24px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{color:var(--ink2);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden;display:flex}
.bar b{display:block;height:100%;background:var(--accent)}
.bar b.this{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,#D98A2B 4px,#D98A2B 8px)}
.bar b.over{background:var(--bad)}
.muted{color:var(--ink2)}
.mono{font-family:var(--mono);font-size:12.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#1c2f4b}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#116632}
.btn.bad{color:var(--bad)}
.btn.badfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-style:dashed;color:var(--ink2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.req:focus-visible,tr.click:focus-visible,.tab:focus-visible,.chip:focus-visible,.agentrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--ink3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFBFC}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-off{background:var(--bg);color:var(--ink3)}
.rail{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink2)}
.empty{text-align:center;color:var(--ink2);padding:28px 10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}

/* approvals: priority block */
.prio{border-color:var(--warn-line);box-shadow:0 0 0 3px var(--warn-soft)}
.prio .card-h h2{display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--warn);color:#fff}
.caught{display:flex;align-items:center;gap:12px;color:var(--ink2)}
.caught .ico{width:32px;height:32px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:700;flex:none}
.reqs{display:grid;gap:8px}
.req{all:unset;box-sizing:border-box;display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel)}
.req:hover{border-color:var(--warn-line);background:#FFFCF7}
.req-amt{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.req-main{line-height:1.45;min-width:0;overflow-wrap:anywhere}
.req-why{font-size:12.5px;color:var(--warn)}

/* tabs & chips */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink2);font-weight:550;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* agents list */
.agentrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.4fr 1.2fr auto 20px;gap:16px;align-items:center;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%}
.agentrow:last-child{border-bottom:0}
.agentrow:hover{background:#FAFBFC}
.agentrow .bar{margin-top:6px}
.chev{color:var(--ink3)}

/* wizard */
.stepper{list-style:none;display:flex;gap:8px;padding:0;margin:0 0 16px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;color:var(--ink3);font-weight:550;font-size:13px}
.stepper li+li::before{content:"";width:28px;height:1px;background:var(--line);margin-right:0}
.stepper span{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;background:var(--panel)}
.stepper li.on{color:var(--ink)} .stepper li.on span{border-color:var(--ink);background:var(--ink);color:#fff}
.stepper li.done{color:var(--ink2)} .stepper li.done span{border-color:var(--ok);background:var(--ok);color:#fff}
.wiz{max-width:620px;display:grid;gap:18px}
.wiz h2{font-size:17px}
.wiz .lead{color:var(--ink2);margin:-12px 0 0}
.field{display:grid;gap:6px}
.field>span:first-child{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--ink3)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
.money-in{position:relative}
.money-in::before{content:"$";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.money-in input{padding-left:22px;padding-right:90px;-moz-appearance:textfield}
.money-in input::-webkit-outer-spin-button,.money-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money-in em{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-style:normal;font-size:12px}
.summary{background:var(--accent-soft);border-radius:10px;padding:12px 14px;color:#1E3A8A;line-height:1.55}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.vopt:has(input:checked){border-color:var(--ink);background:#FAFBFC}
.vopt input{width:auto;margin-top:3px}
.vopt small{display:block;color:var(--ink3);font-family:var(--mono);font-size:11.5px}
details.adv{border-top:1px solid var(--line);padding-top:12px}
details.adv summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.railopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.railopts label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.railopts input{width:auto}
.review{display:grid;gap:0;border:1px solid var(--line);border-radius:10px}
.review>div{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.review>div:last-child{border-bottom:0}
.review dt{color:var(--ink2);font-size:13px}
.review dd{margin:0}
.wiz-foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.errline{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px}
.warnline{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13px}
.keybox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--ink3);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.code{font-family:var(--mono);font-size:12px;background:#0F1E33;color:#D6DEEA;border-radius:8px;padding:14px;white-space:pre;overflow:auto;margin:0}
.success-ico{width:44px;height:44px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:22px;font-weight:700}

/* rules list (agent detail) */
.rules{display:grid;gap:0}
.rules>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rules>div:last-child{border-bottom:0}
.rules span:first-child{color:var(--ink2)}
.rules span:last-child{text-align:right;font-weight:550}

/* drawer */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(440px,92vw);box-shadow:0 20px 50px rgba(15,30,51,.18)}
dialog::backdrop{background:rgba(15,30,51,.35)}
.dlg{padding:22px}
.dlg h2{font-size:17px;margin-bottom:8px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(480px,100vw);max-width:100vw;border:0;border-left:1px solid var(--line);border-radius:0}
dialog.drawer[open]{display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.dr-head b{font-size:14px}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink2);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--bg)}
.dr-body{flex:1;overflow:auto;padding:20px;display:grid;gap:20px;align-content:start}
.dr-hero .amt{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.dr-hero p{margin:6px 0 10px;font-size:15px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);margin:0 0 8px;font-weight:600}
.kv{display:grid;gap:0;border:1px solid var(--line);border-radius:10px}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.kv>div:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{text-align:right}
.quote{border-left:3px solid var(--line);padding:4px 0 4px 12px;color:var(--ink);font-style:italic}
.why{background:var(--warn-soft);border-radius:10px;padding:12px;color:#7A3E06}
.why b{display:block;margin-bottom:2px;color:var(--warn)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dr-foot{border-top:1px solid var(--line);padding:14px 20px;display:grid;gap:10px;background:var(--panel)}
.dr-foot .acts{display:flex;gap:8px;justify-content:flex-end}
.dr-foot .acts .btn{flex:1}

.toast{position:fixed;left:50%;bottom:20px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;max-width:380px;font-size:13px;box-shadow:0 10px 30px rgba(15,30,51,.25);transform:translate(-50%,20px);opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .g3>:last-child{grid-column:1/-1}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:4px;align-items:center}
  .brand{padding:0 10px 0 0}
  .side .foot{display:none}
  .nav{white-space:nowrap;gap:6px}
  main{padding:20px 16px 60px}
  .g3{grid-template-columns:1fr 1fr}
  .g2,.vgrid{grid-template-columns:1fr}
  .hide-sm{display:none}
  td,th{padding:9px 5px}
  td.mono{font-size:11.5px;word-break:break-all}
  .card{padding:14px}
  .req{grid-template-columns:minmax(0,1fr) auto;width:100%}
  .req-main{grid-column:1/-1;grid-row:2}
  .agentrow{grid-template-columns:1fr auto 20px}
  .review>div{grid-template-columns:1fr auto}
  .review dd{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>
<div class="note">Concept prototype by <a href="../">Sudheer Darla</a>, based on public info from saifuro.com. Not affiliated with Saifuro. All data is fake.</div>

<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand"><i></i>Saifuro</div>
    <a class="nav" href="#home" data-r="home">Home</a>
    <a class="nav" href="#approvals" data-r="approvals">Approvals <span class="count" id="holdCount" hidden></span></a>
    <a class="nav" href="#agents" data-r="agents">Agents</a>
    <a class="nav" href="#activity" data-r="activity">Activity</a>
    <div class="foot">
      <div class="demo">
        <b style="color:var(--ink2)">Prototype controls</b>
        <button class="linkbtn" onclick="simulate()">Simulate an agent payment</button>
        <button class="linkbtn" onclick="simulate('big')">Simulate a large purchase</button>
        <button class="linkbtn" onclick="resetDemo()">Reset demo data</button>
      </div>
      <span>Acme Research · Pilot<br>Funds stay in your wallet</span>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="drawer" class="drawer" aria-labelledby="drTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- reference data ---------- */
const VENDORS = {
  'api.acme-data.dev':  {name:'Acme Data',  what:'Dataset search',   min:1,    max:9},
  'api.lexcorpus.com':  {name:'LexCorpus',  what:'Case law bundle',  min:180,  max:420},
  'api.tempo-fx.io':    {name:'Tempo FX',   what:'FX quote',         min:0.4,  max:2},
  'api.newsgrid.dev':   {name:'Newsgrid',   what:'News crawl',       min:0.02, max:0.2},
  'api.skyfare.travel': {name:'Skyfare',    what:'Flight booking',   min:120,  max:680},
};
const RAILS = [
  {id:'x402', desc:'HTTP-native stablecoin payments'},
  {id:'acp',  desc:'Agentic Commerce Protocol'},
  {id:'ap2',  desc:'Agent Payments Protocol'},
  {id:'card', desc:'Virtual card'},
];
const STATUS = {
  paid:     {label:'Paid',           cls:'t-ok'},
  waiting:  {label:'Needs approval', cls:'t-warn'},
  approved: {label:'Approved',       cls:'t-ok'},
  declined: {label:'Declined',       cls:'t-bad'},
  blocked:  {label:'Blocked',        cls:'t-bad'},
};
const APPROVAL_WINDOW = 60; // minutes before an unanswered request auto-declines
const NOTES = [
  'Needed to finish the current task.',
  'Higher tier needed for the full result set.',
  'Requested by the team lead for this week’s report.',
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const money = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$' + n.toLocaleString('en-US',{maximumFractionDigits:2});
const uid = p => p + '_' + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const minsAgo = m => new Date(Date.now() - m*60000);
const clock = d => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
function ago(d){ const m=Math.round((Date.now()-d)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; return Math.floor(m/60)+' h ago'; }
const vname = h => VENDORS[h] ? VENDORS[h].name : h;
const agentOf = e => S.agents.find(a => a.id===e.agentId);
const counts = e => e.status==='paid' || e.status==='approved';
const spent = aid => S.ledger.filter(e => e.agentId===aid && counts(e)).reduce((s,e)=>s+e.amount,0);
const waiting = () => S.ledger.filter(e => e.status==='waiting');
const tag = s => `<span class="tag ${STATUS[s].cls}">${STATUS[s].label}</span>`;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200); }

/* ---------- state ---------- */
const S = { agents:[], ledger:[], wiz:null, apTab:'waiting', filter:'all', review:null };

function seed(){
  const r = {id:'agt_r7k2', name:'research-bot', purpose:'Datasets, search and legal research APIs', active:true,
    daily:1000, perTx:500, approveAbove:200, vendors:['api.acme-data.dev','api.lexcorpus.com','api.tempo-fx.io'], rails:['x402','acp']};
  const t = {id:'agt_t3m9', name:'travel-desk', purpose:'Team flights for customer visits', active:true,
    daily:2000, perTx:900, approveAbove:400, vendors:['api.skyfare.travel','api.tempo-fx.io'], rails:['acp','card']};
  S.agents = [r,t];
  const L = (m,a,v,amount,rail,status,rule,x={}) => ({id:uid('pay'), at:minsAgo(m), agentId:a.id, vendor:v, what:VENDORS[v].what, amount, rail, status, rule, ...x});
  S.ledger = [
    L(3,  t,'api.skyfare.travel',642.00,'acp','waiting','Over travel-desk’s $400 auto-approve limit',
      {what:'Flight BLR → SFO, 12 Nov, economy', note:'Customer visit at Northwind on 13 Nov. This is the cheapest fare that lands the day before.'}),
    L(9,  r,'api.lexcorpus.com', 312.40,'x402','waiting','Over research-bot’s $200 auto-approve limit',
      {what:'EU case law bundle, 2024', note:'Contract review task #142 needs EU precedent on data-processing clauses.'}),
    L(14, r,'api.acme-data.dev',   6.20,'x402','paid','Within limits'),
    L(22, r,'api.newsgrid.dev',    0.12,'x402','blocked','Newsgrid isn’t on research-bot’s vendor list'),
    L(31, t,'api.tempo-fx.io',     1.10,'acp', 'paid','Within limits'),
    L(48, r,'api.acme-data.dev',   4.75,'x402','paid','Within limits'),

/* ---------- policy check (toy) ---------- */
function evaluate(a, vendor, amount, rail){
  if(!a.active) return {status:'blocked', rule:`${a.name} is paused`};
  if(!a.vendors.includes(vendor)) return {status:'blocked', rule:`${vname(vendor)} isn’t on ${a.name}’s vendor list`};
  if(!a.rails.includes(rail)) return {status:'blocked', rule:`${rail} isn’t an allowed payment rail`};
  if(amount > a.perTx) return {status:'blocked', rule:`Over ${a.name}’s ${money0(a.perTx)} per-payment cap`};
  if(spent(a.id) + amount > a.daily) return {status:'blocked', rule:`Would go over ${a.name}’s ${money0(a.daily)} daily budget`};
  if(amount > a.approveAbove) return {status:'waiting', rule:`Over ${a.name}’s ${money0(a.approveAbove)} auto-approve limit`};
  return {status:'paid', rule:'Within limits'};
}

function simulate(kind){
  const pool = S.agents.filter(a=>a.active);
  if(!pool.length){ toast('No active agents. Create or resume one first.'); return; }
  let a = pool[Math.floor(Math.random()*pool.length)];
  let vendor, amount;
  if(kind==='big'){
    const opts = pool.flatMap(ag => ag.vendors.filter(v=>VENDORS[v] && VENDORS[v].max > ag.approveAbove).map(v=>[ag,v]));
    if(!opts.length){ toast('No agent has a vendor big enough to need approval.'); return; }
    [a, vendor] = opts[Math.floor(Math.random()*opts.length)];
    amount = +(Math.max(a.approveAbove+5, VENDORS[vendor].min) + Math.random()*(Math.min(a.perTx, VENDORS[vendor].max) - Math.max(a.approveAbove+5, VENDORS[vendor].min))).toFixed(2);
  } else {
    const roll = Math.random();
    const all = Object.keys(VENDORS);
    vendor = roll < .15 ? all.find(v=>!a.vendors.includes(v)) || a.vendors[0] : a.vendors[Math.floor(Math.random()*a.vendors.length)];
    const v = VENDORS[vendor] || {min:1,max:20};
    const hi = roll > .85 ? v.max : Math.min(v.max, v.min + (v.max-v.min)*.4);
    amount = +(v.min + Math.random()*(hi-v.min)).toFixed(2);
  }
  const rail = a.rails[Math.floor(Math.random()*a.rails.length)];
  const r = evaluate(a, vendor, amount, rail);
  const e = {id:uid('pay'), at:new Date(), agentId:a.id, vendor, what:(VENDORS[vendor]||{what:'API call'}).what, amount, rail, ...r};
  if(r.status==='waiting') e.note = NOTES[Math.floor(Math.random()*NOTES.length)];
  S.ledger.unshift(e);
  toast(r.status==='waiting' ? `New approval request: ${a.name} wants to pay ${money(amount)}`
      : r.status==='paid' ? `${a.name} paid ${vname(vendor)} ${money(amount)}`
      : `Blocked: ${r.rule}`);
  render();
}

  if(!rows.length) return `<div class="empty"><b>${opts.emptyTitle||'No payments yet'}</b>${opts.emptyText||'Payments your agents make will show up here.'}</div>`;
  return `<table><thead><tr><th>Time</th>${opts.noAgent?'':'<th>Agent</th>'}<th class="hide-sm">Vendor</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>

    <td class="num">${money(e.amount)}</td><td>${tag(e.status)}</td></tr>`).join('')}
  </tbody></table>`;
}
function budgetBar(a, extra=0){
  const sp = spent(a.id), pct = Math.min(100, sp/a.daily*100), ex = Math.max(0, Math.min(100-pct, extra/a.daily*100));
  const over = sp + extra > a.daily;
  return `<div class="bar"><b style="width:${pct}%"></b>${extra?`<b class="${over?'over':'this'}" style="width:${over?100-pct:ex}%"></b>`:''}</div>`;
}

  render();
}

    <dl class="review" style="margin:0">
      <div><dt>Agent</dt><dd><b>${esc(w.name)}</b><br><span class="muted">${esc(w.purpose)}</span></dd><button type="button" class="linkbtn" onclick="wizGo(0)">Edit</button></div>
      <div><dt>Limits</dt><dd>${money0(+w.daily)} a day · ${money0(+w.perTx)} max per payment<br><span class="muted">Asks you above ${money0(+w.approveAbove)}</span></dd><button type="button" class="linkbtn" onclick="wizGo(1)">Edit</button></div>
      <div><dt>Can pay</dt><dd>${allVendors(w).map(v=>esc(vname(v))).join(', ')}<br><span class="muted">via ${w.rails.join(', ')}</span></dd><button type="button" class="linkbtn" onclick="wizGo(2)">Edit</button></div>
    </dl>
    <div class="summary">${limitSentence(w)}</div>`,
];

V['agents/new'] = () => {
  if(!S.wiz) wizStart();
  const w = S.wiz;
  if(w.done) return wizDone();
  return `
  <div class="head"><div><a class="back" href="#agents">← Agents</a><h1>New agent</h1></div></div>
  <ol class="stepper" aria-label="Progress">${STEPS.map((s,i)=>`<li class="${i<w.step?'done':''} ${i===w.step?'on':''}" ${i===w.step?'aria-current="step"':''}><span>${i<w.step?'✓':i+1}</span>${s}</li>`).join('')}</ol>
  <form class="card wiz" novalidate onsubmit="wizNext(event)" oninput="wizSave(this)" onchange="wizSave(this)">
    ${WSTEP[w.step](w)}
    ${w.err?`<div class="errline" role="alert">${esc(w.err)}</div>`:''}
    <div class="wiz-foot">
      ${w.step ? `<button type="button" class="btn" onclick="wizBack()">Back</button>` : `<a class="btn" href="#agents">Cancel</a>`}
      <button class="btn pri">${w.step===3?'Create agent':'Continue'}</button>
    </div>
  </form>`;
};

function wizSave(f){
  const w = S.wiz, fd = new FormData(f), has = n => f.elements.namedItem(n);
  if(has('name')) w.name = fd.get('name').trim();
  if(has('purpose')) w.purpose = fd.get('purpose').trim();
  ['daily','perTx','approveAbove'].forEach(k => { if(has(k)) w[k] = fd.get(k); });
  if(has('vendors')) w.vendors = fd.getAll('vendors');
  if(has('extra')) w.extra = fd.get('extra');
  if(has('rails')) w.rails = fd.getAll('rails');
  const s = $('#limitSummary'); if(s) s.innerHTML = limitSentence(w);
  const sum = f.querySelector('details.adv summary'); if(sum) sum.textContent = `Payment rails (${w.rails.join(', ')||'none'})`;
}
function wizValidate(w){
  if(w.step===0){
    if(!/^[a-z0-9][a-z0-9-]{1,31}$/.test(w.name)) return 'Give the agent a name of 2+ characters using lowercase letters, numbers and dashes.';
    if(S.agents.some(a=>a.name===w.name)) return `You already have an agent called ${w.name}.`;
    if(!w.purpose) return 'Add a short line about what it pays for.';
  }
  if(w.step===1){
    const d=+w.daily, p=+w.perTx, ap=+w.approveAbove;
    if(!(d>0) || !(p>0) || !(ap>=0) || w.approveAbove==='') return 'Fill in all three amounts.';
    if(p > d) return 'Max per payment can’t be more than the daily budget.';
    if(ap > p) return 'The “ask me” amount should be at or below the max per payment.';
  }
  if(w.step===2){
    if(!allVendors(w).length) return 'Pick at least one vendor this agent may pay.';
    if(!w.rails.length) return 'Turn on at least one payment rail.';
  }
  return '';
}
function wizNext(ev){
  ev.preventDefault();
  wizSave(ev.target);
  const w = S.wiz;
  w.err = wizValidate(w);
  if(w.err){ render(); return; }
  if(w.step < 3){ w.step++; render(); focusWiz(); return; }
  // create
  const vendors = allVendors(w);
  vendors.forEach(v => { if(!VENDORS[v]) VENDORS[v] = {name:v, what:'API call', min:1, max:20}; });
  const a = {id:uid('agt'), name:w.name, purpose:w.purpose, active:true, daily:+w.daily, perTx:+w.perTx, approveAbove:+w.approveAbove, vendors, rails:[...w.rails]};
  S.agents.push(a);
  w.done = {agentId:a.id, key:'sk_agent_' + Array.from({length:24},()=>'abcdef0123456789'[Math.floor(Math.random()*16)]).join('')};
  render(); focusWiz();
}
function wizBack(){ const w=S.wiz; w.err=''; w.step=Math.max(0,w.step-1); render(); focusWiz(); }
function wizGo(n){ S.wiz.err=''; S.wiz.step=n; render(); focusWiz(); }
function focusWiz(){ const el = document.querySelector('.wiz input, .wiz h2'); if(el) el.focus({preventScroll:true}); window.scrollTo(0,0); }
function wizDone(){
  const {agentId, key} = S.wiz.done, a = S.agents.find(x=>x.id===agentId);
  return `
  <div class="card wiz" style="margin-top:8px">
    <div class="success-ico" aria-hidden="true">✓</div>
    <div><h2>${esc(a.name)} is live</h2><p class="muted" style="margin:4px 0 0">${limitSentence(a)}</p></div>
    <div class="field"><span>Agent key</span>
      <div class="keybox"><span style="flex:1">${key}</span><button type="button" class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${key}');this.textContent='Copied'">Copy</button></div>
      <div class="warnline">Copy it now. For safety, it's only shown once.</div></div>
    <div class="field"><span>Add it to your agent</span>
<pre class="code">const res = await saifuro.fetch(url, {
  agent: '${a.id}'
})</pre></div>
    <div class="wiz-foot"><a class="btn" href="#home" onclick="S.wiz=null">Back to home</a><button type="button" class="btn pri" onclick="S.wiz=null;go('agents/${a.id}')">View agent</button></div>
  </div>`;
}

/* ---------- agent actions ---------- */
function togglePause(aid){
  const a = S.agents.find(x=>x.id===aid);
  if(!a.active){ a.active=true; toast(`${a.name} resumed. It can pay again within its rules.`); render(); return; }
  $('#dlgBody').innerHTML = `<h2>Pause ${esc(a.name)}?</h2>
    <p class="muted" style="margin:0">Every payment it tries will be blocked until you resume it. Its key and rules stay as they are.</p>
    <div class="acts"><button class="btn" onclick="dlg.close()">Cancel</button><button class="btn badfill" onclick="doPause('${aid}')">Pause agent</button></div>`;
  dlg.showModal();
}
function doPause(aid){ const a=S.agents.find(x=>x.id===aid); a.active=false; dlg.close(); toast(`${a.name} paused.`); render(); }

function exportCSV(){
  const head = 'id,time,agent,vendor,item,rail,amount_usdc,status,rule,decided_by';
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const rows = S.ledger.map(e=>[e.id, e.at.toISOString(), agentOf(e).name, e.vendor, e.what, e.rail, e.amount.toFixed(2), STATUS[e.status].label, e.rule, e.decidedBy||'policy'].map(q).join(','));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([head+'\n'+rows.join('\n')],{type:'text/csv'})); a.download='saifuro-activity.csv'; a.click();
  toast('Activity exported for finance.');
}
function resetDemo(){ seed(); S.wiz=null; S.apTab='waiting'; S.filter='all'; go('home'); render(); toast('Demo data reset.'); }

/* ---------- router ---------- */
const dlg = $('#dlg');
function go(r){ if(location.hash.slice(1)===r) render(); else location.hash = r; }
function render(){
  const r = location.hash.slice(1) || 'home';
  let html, nav;
  if(r==='agents/new'){ html = V['agents/new'](); nav='agents'; }
  else if(r.startsWith('agents/')){ html = V.agent(r.split('/')[1]); nav='agents'; }
  else if(V[r]){ html = V[r](); nav=r; }
  else { html = V.home(); nav='home'; }
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on', n.dataset.r===nav));
  const h = waiting().length, c=$('#holdCount'); c.hidden=!h; c.textContent=h;
  document.title = (h?`(${h}) `:'') + 'Saifuro Console — concept';
  if(S.review && drawer.open) renderDrawer();
}
window.addEventListener('hashchange', ()=>{ render(); $('#view').focus({preventScroll:true}); window.scrollTo(0,0); });
seed();
render();
</script>
</body>
</html>
